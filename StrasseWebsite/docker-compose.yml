services:

  strassewebsite:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: strassewebsite

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Banco de dados
      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION}

      # Supabase
      Supabase__Url: ${SUPABASE_URL}
      Supabase__ApiKey: ${SUPABASE_API_KEY}

      # E-mail